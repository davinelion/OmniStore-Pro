name: Ingest

# Refreshes data/omnisource-feed.json from upstream and opens a pull request.
# Run manually, or on the schedule below (weekly, Monday 05:17 UTC).
#
# The ingest script refuses to shrink the feed: if upstream credentials fail
# mid-run the job fails loudly instead of replacing good data with a partial set.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Re-ingest a single source, e.g. owner/repo (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Ingest upstream data
        env:
          GITHUB_TOKEN: ${{ secrets.INGEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ONLY_SOURCE: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY_SOURCE" ]; then
            npm run ingest -- "--only=$ONLY_SOURCE"
          else
            npm run ingest
          fi

      - name: Open a pull request with the refreshed feed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): refresh OmniSource feed"
          title: "chore(data): refresh OmniSource feed"
          body: |
            Automated refresh of `data/omnisource-feed.json`.

            - Sources: `data/sources.json`
            - Report: `data/ingest-report.json` (counts, skipped sources, coverage)
            - Never edits application code.
          branch: chore/refresh-feed
          delete-branch: true
          add-paths: |
            data/omnisource-feed.json
            data/ingest-report.json
