name: Automated Catalog Ingest

on:
  schedule:
    # Daily at 02:00 UTC - refresh catalog from upstream
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force write even if many sources fail"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      limit:
        description: "Limit number of sources (empty = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  ingest:
    name: Refresh OmniSource feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ingest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi
          echo "Running: npm run ingest -- $ARGS"
          npm run ingest -- $ARGS

      - name: Build website catalog (static marketing site)
        run: |
          if [ -f website/scripts/build-catalog.mjs ]; then
            node website/scripts/build-catalog.mjs || echo "Website catalog build skipped"
          fi

      - name: Check for changes
        id: check
        run: |
          git diff --quiet -- data/ || echo "changed=true" >> $GITHUB_OUTPUT
          if [ -f website/data/catalog.json ]; then
            git diff --quiet -- website/data/ || echo "website_changed=true" >> $GITHUB_OUTPUT
          fi
          echo "Feed stats:"
          cat data/omnisource-feed.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(f\"Apps: {d['stats']['applications']} Releases: {d['stats']['releases']} Assets: {d['stats']['assets']}\")" || true

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true' || steps.check.outputs.website_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/omnisource-feed.json
          if [ -f website/data/catalog.json ]; then
            git add website/data/ || true
          fi
          # Also add sources.json if it was updated manually
          git add data/sources.json || true

          FEED_DATE=$(python3 -c "import json; print(json.load(open('data/omnisource-feed.json'))['generated_at'])" 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)
          APPS=$(python3 -c "import json; print(json.load(open('data/omnisource-feed.json'))['stats']['applications'])" 2>/dev/null || echo "unknown")

          git commit -m "chore(data): automated ingest $FEED_DATE - $APPS apps

          - Refreshed from upstream GitHub releases
          - Validated assets only
          - Auto-generated by ingest workflow"

          git push origin HEAD:${{ github.ref_name }}

      - name: Summary
        run: |
          echo "### OmniStore Automated Ingest ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            echo "Feed updated and pushed." >> $GITHUB_STEP_SUMMARY
          else
            echo "No changes detected - catalog is up to date." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Stats:" >> $GITHUB_STEP_SUMMARY
          cat data/omnisource-feed.json | python3 -c "import json,sys; d=json.load(sys.stdin); s=d['stats']; print(f\"- **{s['applications']} apps**\n- **{s['releases']} releases**\n- **{s['assets']} assets**\n- **{s['platforms']} platforms**\n- **{s['categories']} categories**\")" >> $GITHUB_STEP_SUMMARY || true

  health-check:
    name: Post-ingest health check
    runs-on: ubuntu-latest
    needs: ingest
    if: always() && needs.ingest.result == 'success'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build check
        run: npm run build
      - name: Verify feed integrity
        run: |
          node - <<'JS'
          const feed = require('./data/omnisource-feed.json');
          if (!feed.apps || feed.apps.length === 0) {
            console.error('Feed has no apps');
            process.exit(1);
          }
          const invalid = feed.apps.filter(a => !a.id || !a.slug || !a.name);
          if (invalid.length > 0) {
            console.error(`Found ${invalid.length} invalid apps`);
            process.exit(1);
          }
          console.log(`✅ Feed OK: ${feed.apps.length} apps, ${feed.stats.releases} releases`);
          JS
