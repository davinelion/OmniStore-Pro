name: Deployment health
on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"
permissions:
  contents: read
jobs:
  check:
    if: ${{ vars.OMNISTORE_MONITOR_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed health and upstream freshness
        env:
          SITE: ${{ vars.OMNISTORE_MONITOR_URL }}
        run: |
          case "$SITE" in https://*) ;; *) echo "Monitor URL must use HTTPS"; exit 1 ;; esac
          curl --fail --silent --show-error --max-time 30 "$SITE/api/v1/health" > health.json
          node - <<'JS'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (h.status !== 'ok') {
            console.error('Deployment is unhealthy.'); process.exit(1);
          }
          if (!h.upstream || h.upstream === 'unreachable') {
            console.error('OmniSource upstream is unreachable.'); process.exit(1);
          }
          console.log('Deployment healthy; OmniSource upstream:', h.upstream);
          JS
